[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sclass"
version = "6.0.0"
description = "S-Class EOS: Zero-Trust Autonomous Engineering Guard & Control Plane"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "ak-bharadwaj", email = "dev@sclass.ai" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
]
dependencies = [
    "psutil>=6.0.0",
    "portalocker>=2.8.0",
    "rfc8785>=0.1.4",
    "cryptography>=42.0.0",
    "pydantic>=2.5.0",
    "jsonschema>=4.20.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "tiktoken>=0.7.0",
    "tenacity>=8.2.0",
    "networkx>=3.0",
    "fastapi>=0.100.0",
    "starlette>=0.30.0",
    "mcp>=1.0.0",
    "textual>=0.50.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "tree-sitter>=0.21.0",
    "tree-sitter-javascript>=0.21.0",
    "tree-sitter-typescript>=0.21.0",
    "exceptiongroup>=1.2.0; python_version < '3.11'",
    "async-timeout>=4.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "schemathesis>=3.20.0",
    "ruff>=0.3.0",
    "pyright>=1.1.0",
]

[project.scripts]
sclass = "sclass_cli:run_cli"
sclass-guard = "hook_runner:main"

[tool.setuptools]
include-package-data = true
py-modules = [
    "accessibility_auditor",
    "adversarial_skeptic",
    "app_quality_verifier",
    "architecture_debate",
    "artifact_dag",
    "artifact_governor",
    "ast_dependency_resolver",
    "ast_graph_extractor",
    "behavior_graph",
    "codebase_graph_db",
    "codebase_kg_server",
    "config_gc",
    "context_budget",
    "context_compressor",
    "delta_spec_manager",
    "diff_auditor",
    "doctor",
    "domain_primitives",
    "error_recovery",
    "evaluation",
    "event_graph",
    "export_md",
    "failure_log",
    "file_lock",
    "git_automation",
    "graph_rag",
    "graph_traversal",
    "hld_compiler",
    "hook_core",
    "hook_rules",
    "hook_runner",
    "install",
    "instructions_loader",
    "intent_contract",
    "knowledge_base",
    "learning_engine",
    "lld_compiler",
    "mcp_installer",
    "mcp_server",
    "mermaid_synthesizer",
    "migrate_v5_to_v6",
    "monitoring",
    "observability",
    "package_verifier",
    "planner",
    "port_resolver",
    "practical_skeptic",
    "promise_protocol",
    "replay",
    "requirement_ir",
    "resilience",
    "resource_scheduler",
    "rule_generator",
    "runtime",
    "sclass_cli",
    "sclass_doctor",
    "sclass_grill",
    "sclass_kernel",
    "sclass_planner",
    "sclass_skill_discovery",
    "sclass_skill_orchestrator",
    "sclass_subagent_registry",
    "sclass_watch_tui",
    "screenshot_capture",
    "sdd_pipeline",
    "sdk_interface",
    "secret_scanner",
    "security_shield",
    "semantic_decomposer",
    "session_handoff",
    "skill_auto_loader",
    "spec_compiler",
    "spec_synthesis",
    "staleness_cascade",
    "steering",
    "strategy",
    "subagent_selector",
    "task_classifier",
    "task_compiler",
    "token_budget",
    "topology",
    "verifier",
    "workspace_preflight_scanner",
    "worktree_manager",
    "zero_infra_db",
]

[tool.setuptools.packages.find]
include = ["adapters*", "controller*"]

[tool.setuptools.package-data]
"*" = ["*.json", "instructions/*", "prompts/*"]

[tool.setuptools.data-files]
"" = [
    "capabilities.json",
    "events.json",
    "plugin.json",
    "policies.json",
    "regression_cases.json",
    "sclass.config.json",
    "state_schema.json",
    "workflow.json",
]
"instructions" = [
    "instructions/analysis.md",
    "instructions/coding.md",
    "instructions/core.md",
    "instructions/debate.md",
    "instructions/demo.md",
    "instructions/design.md",
    "instructions/micro.md",
    "instructions/qa.md",
    "instructions/release.md",
    "instructions/spec_synthesis.md",
    "instructions/triage.md",
]
"prompts" = [
    "prompts/aggregator.md",
    "prompts/analyst.md",
    "prompts/architect.md",
    "prompts/builder.md",
    "prompts/cso.md",
    "prompts/governor.md",
    "prompts/integrator.md",
    "prompts/memory.md",
    "prompts/qa.md",
    "prompts/release_manager.md",
    "prompts/reviewer.md",
    "prompts/user_alias.md",
]
