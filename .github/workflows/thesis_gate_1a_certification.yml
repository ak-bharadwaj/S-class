name: S-Class THESIS-GATE-1A - Enterprise Core & Synthetic Efficacy

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify-thesis-gate-1a:
    name: THESIS-GATE-1A Certification (Ubuntu 24.04 / Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - name: Checkout S-Class Plugin Repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 # v4.2.2
      with:
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0 # v5.4.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest portalocker==4.1.0 hypothesis==6.165.9 schemathesis==4.24.3 psutil pyright ruff pydantic
        pip list

    - name: Run THESIS-GATE-1 Test Suite
      env:
        PYTHONPATH: .
      run: |
        python -m pytest tests/test_evidence_provider_registry.py tests/test_enterprise_core_pipeline.py tests/test_pilot_evaluation_harness.py tests/test_thesis_gate_1a_verifier.py -v

    - name: Run Synthetic Efficacy Pilot (Controlled Failure Injection)
      env:
        PYTHONPATH: .
      run: |
        python benchmark/pilot/synthetic_efficacy_pilot.py --output benchmark/pilot/synthetic_efficacy_receipt_py${{ matrix.python-version }}.json --sha ${{ github.sha }}

    - name: Run External Validation Protocol Smoke Verification
      env:
        PYTHONPATH: .
      run: |
        python benchmark/pilot/external_validation_protocol.py --output benchmark/pilot/external_validation_protocol_receipt_py${{ matrix.python-version }}.json --sha ${{ github.sha }}

    - name: Fail-Closed Verification of THESIS-GATE-1A Certificate
      run: |
        python verify_thesis_gate_1a_certificate.py benchmark/pilot/synthetic_efficacy_receipt_py${{ matrix.python-version }}.json --sha ${{ github.sha }}

    - name: Upload Immutable THESIS-GATE-1A Certificate Artifacts
      uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb99ba841c # v4.6.1 # v4.6.1
      if: always()
      with:
        name: thesis-gate-1a-cert-py${{ matrix.python-version }}-${{ github.sha }}
        path: |
          benchmark/pilot/synthetic_efficacy_receipt_py${{ matrix.python-version }}.json
          benchmark/pilot/external_validation_protocol_receipt_py${{ matrix.python-version }}.json
        retention-days: 90
