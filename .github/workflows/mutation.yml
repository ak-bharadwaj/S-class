name: S-Class S0 Mutation Partition Verification

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  mutation:
    name: S0 Mutation Baseline (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies with --require-hashes (M11)
      run: |
        pip install --require-hashes -r requirements-linux.txt
        pip install --no-build-isolation --no-deps -e ".[dev,verifier]"

    - name: Run S0 Mutation Baseline Partition Verification
      run: |
        python tools/run_all_s0_partitions.py
