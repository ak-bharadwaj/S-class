name: S-Class S0 Mutation Partition Verification

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  mutation:
    name: S0 Mutation Baseline (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies with constraints
      run: |
        python -m pip install --upgrade pip
        pip install -c constraints.txt -e ".[dev,verifier]"

    - name: Run S0 Mutation Baseline Partition Verification
      run: |
        python tools/run_all_s0_partitions.py
