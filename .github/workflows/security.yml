name: S-Class Security & Policy Enforcement

on:
  push:
    branches: [ master, main, survival-v0 ]
  pull_request:
    branches: [ master, main, survival-v0 ]

permissions:
  contents: read

jobs:
  security:
    name: Secret & Policy Audit
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Secret and Security Scanner Tests
      env:
        PYTHONPATH: src:.
      run: |
        python -m pytest tests/test_security_shield.py tests/test_secret_scanner.py -v
