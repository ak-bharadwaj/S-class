name: OSS Parity Gate 1 - Windows Certification

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify-win32-gate-1:
    name: Windows Parity Certification (Windows / Python 3.12)
    runs-on: windows-latest

    steps:
    - name: Checkout S-Class Plugin Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: false

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Pinned Parity Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-parity-win32.txt
        pip list

    - name: Clean Workspace Benchmark Artifacts
      run: |
        Remove-Item -Force benchmark/parity/gate_1_parity_certificate_win32.json -ErrorAction SilentlyContinue
        Remove-Item -Force benchmark/parity/parity_gate_1_raw_results.json -ErrorAction SilentlyContinue
      shell: powershell

    - name: Run Pytest Regression & Contract Differential Suite
      env:
        PYTHONPATH: .
      run: |
        python -m pytest tests/test_parity_metric_gate.py tests/test_file_lock_concurrency.py tests/test_experimental_metadata_writer.py -v

    - name: Run Full Windows Parity Benchmark Harness
      run: |
        python benchmark/parity/file_lock_harness.py

    - name: Strict Certificate Verification & Parity Assertions
      run: |
        python -m benchmark.parity.verify_certificate --certificate benchmark/parity/gate_1_parity_certificate_win32.json --expected-sha ${{ github.sha }}

    - name: Upload Immutable Parity Certificate and Raw Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: oss-parity-gate-1-win32-${{ github.sha }}
        path: |
          benchmark/parity/gate_1_parity_certificate_win32.json
          benchmark/parity/parity_gate_1_raw_results.json
        retention-days: 90
