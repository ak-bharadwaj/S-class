name: OSS Parity Gate 1 - POSIX / Linux Certification

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify-posix-gate-1:
    name: POSIX Parity Certification (Ubuntu 24.04 / Python 3.12)
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout S-Class Plugin Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Pinned Parity Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-parity-linux.txt
        pip list

    - name: Clean Workspace Benchmark Artifacts
      run: |
        rm -f benchmark/parity/gate_1_parity_certificate_posix.json
        rm -f benchmark/parity/parity_gate_1_raw_results.json

    - name: Run Pytest Regression Suite
      env:
        PYTHONPATH: .
      run: |
        python -m pytest tests/test_parity_metric_gate.py tests/test_file_lock_concurrency.py -v

    - name: Run Full POSIX Parity Benchmark Harness
      run: |
        python benchmark/parity/file_lock_harness.py

    - name: Strict Certificate Verification & Parity Assertions
      env:
        EXPECTED_SHA: ${{ github.sha }}
      run: |
        python - << 'EOF'
        import os
        import sys
        import json

        cert_path = "benchmark/parity/gate_1_parity_certificate_posix.json"
        raw_path = "benchmark/parity/parity_gate_1_raw_results.json"
        expected_sha = os.environ.get("EXPECTED_SHA", "").strip()

        if not os.path.isfile(cert_path):
            sys.exit(f"FATAL: Missing certificate at {cert_path}")
        if not os.path.isfile(raw_path):
            sys.exit(f"FATAL: Missing raw results at {raw_path}")

        with open(cert_path, "r", encoding="utf-8") as f:
            cert = json.load(f)

        print("Validating POSIX Certificate Provenance & Gate Assertions...")
        print(json.dumps(cert, indent=2))

        # 1. Structural and platform checks
        assert cert.get("certificate_id") == "OSS-PARITY-GATE-1-FILELOCK-POSIX", f"Invalid certificate_id: {cert.get('certificate_id')}"
        prov = cert.get("provenance", {})
        assert prov.get("os_platform") == "linux", f"Invalid os_platform: {prov.get('os_platform')}"
        assert prov.get("os_system") == "Linux", f"Invalid os_system: {prov.get('os_system')}"
        assert prov.get("portalocker_version") == "4.1.0", f"Invalid portalocker version: {prov.get('portalocker_version')}"
        
        # Verify checked-out source SHA integrity if available
        cert_sha = prov.get("git_commit_sha")
        if expected_sha and cert_sha != "UNKNOWN":
            assert cert_sha == expected_sha, f"SHA mismatch! Expected {expected_sha}, got {cert_sha}"

        # 2. Assert all required parity dimensions passed
        crit = cert.get("acceptance_criteria", {})
        assert crit.get("soak_cycles_executed") == 5000, "Soak cycles must be 5,000"

        assert cert.get("layer_a_primitive", {}).get("median_ratio_95_ci", [99, 99])[1] <= 1.005, "Layer A median upper CI failed"
        assert cert.get("layer_a_primitive", {}).get("p95_ratio_95_ci", [99, 99])[1] <= 1.005, "Layer A P95 upper CI failed"
        assert cert.get("layer_a_primitive", {}).get("throughput_ratio_95_ci", [0, 0])[0] >= 0.995, "Layer A throughput lower CI failed"

        assert cert.get("layer_a_same_path_primitive", {}).get("median_ratio_95_ci", [99, 99])[1] <= 1.005, "Layer A-SP median upper CI failed"
        assert cert.get("layer_a_same_path_primitive", {}).get("p95_ratio_95_ci", [99, 99])[1] <= 1.005, "Layer A-SP P95 upper CI failed"
        assert cert.get("layer_a_same_path_primitive", {}).get("throughput_ratio_95_ci", [0, 0])[0] >= 0.995, "Layer A-SP throughput lower CI failed"

        assert cert.get("layer_c_equivalent_lifecycle", {}).get("median_ratio_95_ci", [99, 99])[1] <= 1.005, "Layer C median upper CI failed"
        assert cert.get("layer_c_equivalent_lifecycle", {}).get("p95_ratio_95_ci", [99, 99])[1] <= 1.005, "Layer C P95 upper CI failed"
        assert cert.get("layer_c_equivalent_lifecycle", {}).get("throughput_ratio_95_ci", [0, 0])[0] >= 0.995, "Layer C throughput lower CI failed"

        assert cert.get("soak_memory_drift", {}).get("drift_ratio", 99) <= 1.050, "Soak memory drift failed"
        assert cert.get("cross_implementation_interoperability", {}).get("status") == "PASS", "Interoperability failed"
        assert cert.get("differential_timeout_semantics", {}).get("status") == "PASS", "Timeout semantics failed"
        assert cert.get("differential_multithreading_contention", {}).get("status") == "PASS", "Multithreading failed"
        assert cert.get("differential_multiprocess_exclusion", {}).get("status") == "PASS", "Multiprocessing failed"
        assert cert.get("differential_crash_recovery", {}).get("status") == "PASS", "Crash recovery failed"

        assert cert.get("final_verdict") == "PASS", f"Final certificate verdict must be PASS, got: {cert.get('final_verdict')}"
        print("ALL POSIX PARITY GATE 1 ASSERTIONS PASSED PERFECTLY!")
        EOF

    - name: Upload Immutable Parity Certificate and Raw Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: oss-parity-gate-1-posix-${{ github.sha }}
        path: |
          benchmark/parity/gate_1_parity_certificate_posix.json
          benchmark/parity/parity_gate_1_raw_results.json
        retention-days: 90
