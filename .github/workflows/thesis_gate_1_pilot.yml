name: S-Class THESIS-GATE-1 - Enterprise Core & Pilot Validation

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify-thesis-gate-1:
    name: THESIS-GATE-1 Pilot Validation (Ubuntu 24.04 / Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - name: Checkout S-Class Plugin Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest portalocker==4.1.0 hypothesis==6.165.9 schemathesis==4.24.3 psutil pyright ruff pydantic
        pip list

    - name: Run THESIS-GATE-1 Test Suite
      env:
        PYTHONPATH: .
      run: |
        python -m pytest tests/test_evidence_provider_registry.py tests/test_enterprise_core_pipeline.py tests/test_pilot_evaluation_harness.py -v

    - name: Run Full Pilot Evaluation Campaign
      env:
        PYTHONPATH: .
      run: |
        python benchmark/pilot/pilot_evaluation_harness.py --output benchmark/pilot/pilot_validation_receipt_py${{ matrix.python-version }}.json --sha ${{ github.sha }}

    - name: Strict Verification of Pilot Validation Receipt
      run: |
        python -c "import json; r = json.load(open('benchmark/pilot/pilot_validation_receipt_py${{ matrix.python-version }}.json')); assert r['final_pilot_verdict'] == 'PASS' and r['comparative_metrics']['treatment_defects_escaped'] == 0 and r['comparative_metrics']['false_positive_gate_passed'] is True, f'Pilot validation failed: {r}'; print(f'THESIS-GATE-1 Python ${{ matrix.python-version }} Pilot Validation Certified: 100% defect elimination, 0 escaped.')"

    - name: Upload Immutable THESIS-GATE-1 Validation Receipt
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: thesis-gate-1-pilot-receipt-py${{ matrix.python-version }}-${{ github.sha }}
        path: benchmark/pilot/pilot_validation_receipt_py${{ matrix.python-version }}.json
        retention-days: 90
