name: OSS Parity Gate 1 - POSIX Candidate vs Current Verification

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-candidate-vs-current:
    name: POSIX Candidate vs Current Verification (Ubuntu 24.04 / Python 3.12)
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout S-Class Plugin Repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 # v4.2.2
      with:
        fetch-depth: 0

    - name: Set up Python 3.12
      uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0 # v5.4.0
      with:
        python-version: "3.12"

    - name: Install Pinned Parity Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-parity-linux.txt

    - name: Run Complete Differential Verification Suite
      env:
        PYTHONPATH: .
      run: |
        python -m pytest tests/test_experimental_metadata_writer.py -v

    - name: Run Direct Head-to-Head Benchmark (Candidate vs Current)
      run: |
        python benchmark/parity/benchmark_candidate_vs_current.py

    - name: Upload Comparison Artifacts
      uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb99ba841c # v4.6.1 # v4.6.1
      if: always()
      with:
        name: posix-candidate-vs-current-${{ github.sha }}
        path: benchmark/parity/candidate_vs_current_results.json
        retention-days: 90
