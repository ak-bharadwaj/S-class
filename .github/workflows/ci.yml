name: S-Class EOS Engine CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov pytest-cov portalocker==4.1.0 hypothesis==6.165.9 schemathesis==4.24.3 psutil pyright ruff pydantic

    - name: Run Pytest Suite
      env:
        PYTHONPATH: .
      run: |
        python -m pytest tests/ --cov=domain --cov=events --cov-report=term-missing --cov-fail-under=85 -v
