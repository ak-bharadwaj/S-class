name: S-Class CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  verify:
    name: Verification (${{ matrix.os }} - Py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Verify deliberately unpinned requirement fails --require-hashes (M11)
      run: |
        echo "unpinned-dummy-pkg>=1.0.0" > /tmp/unpinned.txt
        if pip install --dry-run --require-hashes -r /tmp/unpinned.txt; then
          echo "SECURITY VIOLATION: --require-hashes accepted unpinned requirement!"
          exit 1
        fi
        echo "PASS: pip --require-hashes strictly rejected unpinned requirement."

    - name: Install dependencies with --require-hashes (M11)
      run: |
        python -m pip install --upgrade pip
        pip install --require-hashes -r requirements-linux.txt
        pip install --no-deps -e ".[dev,verifier]"

    - name: Run Block 1-00 Kernel Registry & Frozen Byte Guards
      run: |
        python -m pytest tests/guards/ -v

    - name: Run pip-audit supply chain audit (M11)
      run: |
        pip install pip-audit
        pip-audit -r requirements-linux.txt -f json -o pip-audit-report.json
        pip-audit -r requirements-linux.txt

    - name: Install system dependencies (Bubblewrap)
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends bubblewrap procps iproute2

    - name: Setup delegated cgroup v2 subtree (M5)
      run: |
        if [ -d /sys/fs/cgroup ]; then
          sudo mkdir -p /sys/fs/cgroup/sclass
          sudo chown -R $USER:$USER /sys/fs/cgroup/sclass
          echo "+memory +pids +cpu" | sudo tee /sys/fs/cgroup/cgroup.subtree_control || true
          echo "+memory +pids +cpu" | sudo tee /sys/fs/cgroup/sclass/cgroup.subtree_control || true
          sudo chmod 666 /sys/fs/cgroup/cgroup.procs || true
        fi

    - name: Apply narrow bwrap AppArmor profile on Ubuntu 24.04 (M7)
      if: matrix.os == 'ubuntu-24.04'
      run: |
        sudo apparmor_parser -r docs/security/bwrap-apparmor-profile

    - name: CO-1 Stress Test Process Tree Monitor (20x under 4-worker CPU load)
      run: |
        bash tools/ci/stress_test_process_monitor.sh

    - name: Run Complete Verification Suite (Gates, Clean Wheel Smoke, Tests)
      run: |
        bash tools/verify_all.sh

    - name: Upload Verification Artifacts (verify_all.log, verify_junit.xml, pip-audit-report.json)
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: verify-artifacts-${{ matrix.os }}-py${{ matrix.python-version }}
        path: |
          verify_all.log
          verify_junit.xml
          pip-audit-report.json
        if-no-files-found: error

  verify-m6-unconfined-blocked:
    name: M6 BoundaryUnavailable on Ubuntu 24.04 (No AppArmor Profile)
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies with --require-hashes (M11)
      run: |
        python -m pip install --upgrade pip
        pip install --require-hashes -r requirements-linux.txt
        pip install --no-deps -e ".[dev,verifier]"

    - name: Install system dependencies (Bubblewrap)
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends bubblewrap procps iproute2

    - name: Verify M6 BoundaryUnavailable when userns blocked (No AppArmor Profile applied)
      run: |
        # Ubuntu 24.04 default: kernel.apparmor_restrict_unprivileged_userns = 1.
        # Without the narrow AppArmor profile, bubblewrap unprivileged user namespaces are blocked.
        # S-Class must fail closed with BoundaryUnavailable and NEVER execute unsandboxed.
        python -c "
        import tempfile, pathlib, sys
        sys.path.insert(0, '20-RUNTIME')
        from sclass_runtime_v6_0_1 import LinuxExecutionBoundary, BoundaryUnavailable
        with tempfile.TemporaryDirectory() as tmp_dir:
            sentinel = pathlib.Path(tmp_dir) / 'm6_real_sentinel.txt'
            b = LinuxExecutionBoundary(tmp_dir)
            try:
                b._run_from_gate(b._gate_capability, [sys.executable, '-c', f'import pathlib; pathlib.Path(r\"{sentinel}\").write_text(\"PROCESS_RAN\")'])
                print('FAIL: Boundary did not fail closed!')
                sys.exit(1)
            except BoundaryUnavailable as e:
                print('PASS: Caught expected BoundaryUnavailable:', e)
                assert not sentinel.exists(), 'SECURITY VIOLATION: Process executed and touched sentinel!'
                print('PASS: Sentinel verified untouched (0 processes started).')
        "
        python -m pytest -v tests/security/test_boundary_hardening.py -k "test_m6_missing_bwrap_or_cgroup_fails_closed_boundary_unavailable"

  verify-m5-delegated-cgroup-sandbox:
    name: M5 Delegated cgroup v2 Sandbox Qualification (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies with --require-hashes (M11)
      run: |
        python -m pip install --upgrade pip
        pip install --require-hashes -r requirements-linux.txt
        pip install --no-deps -e ".[dev,verifier]"

    - name: Install system dependencies (Bubblewrap)
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends bubblewrap procps iproute2

    - name: Apply narrow bwrap AppArmor profile on Ubuntu 24.04 (M7)
      run: |
        sudo apparmor_parser -r docs/security/bwrap-apparmor-profile

    - name: Setup delegated cgroup v2 subtree (M5)
      run: |
        if [ ! -d /sys/fs/cgroup ]; then
          echo "SANDBOX QUALIFICATION: BLOCKED (/sys/fs/cgroup not mounted)"
          exit 1
        fi
        sudo mkdir -p /sys/fs/cgroup/sclass
        sudo chown -R $USER:$USER /sys/fs/cgroup/sclass
        echo "+memory +pids +cpu" | sudo tee /sys/fs/cgroup/cgroup.subtree_control || true
        echo "+memory +pids +cpu" | sudo tee /sys/fs/cgroup/sclass/cgroup.subtree_control || true
        sudo chmod 666 /sys/fs/cgroup/cgroup.procs || true

    - name: Verify delegated cgroup v2 controllers and capabilities
      run: |
        if [ ! -f /sys/fs/cgroup/sclass/cgroup.controllers ]; then
          echo "SANDBOX QUALIFICATION: BLOCKED (/sys/fs/cgroup/sclass/cgroup.controllers missing)"
          exit 1
        fi
        for ctrl in memory pids cpu; do
          if ! grep -qw "$ctrl" /sys/fs/cgroup/sclass/cgroup.controllers; then
            echo "SANDBOX QUALIFICATION: BLOCKED (controller '$ctrl' not delegated)"
            exit 1
          fi
        done
        echo "PASS: Delegated controllers verified (memory, pids, cpu)."

    - name: Execute M5 Boundary Hardening Tests (Strict Zero Skip / Zero Fail Qualification)
      run: |
        python -m pytest -v tests/security/test_boundary_hardening.py -k "test_m5"
        # Verify strict zero skips: skips do NOT qualify the sandbox
        python -c "
        import subprocess, sys
        res = subprocess.run([sys.executable, '-m', 'pytest', '-q', 'tests/security/test_boundary_hardening.py', '-k', 'test_m5'], capture_output=True, text=True)
        print(res.stdout)
        if 'skipped' in res.stdout or res.returncode != 0:
            print('SANDBOX QUALIFICATION FAILED: M5 tests were skipped or failed!')
            sys.exit(1)
        print('PASS: All M5 boundary hardening tests qualified successfully without skips.')
        "

