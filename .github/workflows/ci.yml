name: S-Class EOS Engine CI

on:
  push:
    branches: [ master, main, working-pre-d0 ]
  pull_request:
    branches: [ master, main, working-pre-d0 ]

permissions:
  contents: read

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        pip install psutil ruff

    - name: Run Pytest Suite with Coverage
      env:
        PYTHONPATH: .
      run: |
        python -m pytest tests/ --cov=planner --cov=runtime --cov=verifier --cov=diff_auditor --cov=hook_runner --cov=hook_core --cov=hook_rules --cov=secret_scanner --cov=subagent_selector --cov=token_budget --cov-report=term-missing -v
