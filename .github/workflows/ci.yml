name: S-Class EOS Engine CI

on:
  push:
    branches: [ master, main, survival-v0 ]
  pull_request:
    branches: [ master, main, survival-v0 ]

permissions:
  contents: read
  statuses: write

jobs:
  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-cov psutil pyright ruff

    - name: Run Handoff B.1 Security Certification Suite
      env:
        PYTHONPATH: src:.
      run: |
        python -m pytest tests/certification/test_cert_handoff_b1_security.py -v

    - name: Run Full Test Suite
      env:
        PYTHONPATH: src:.
      run: |
        python -m pytest tests/ -v

    - name: Run Flagship Product Demos
      env:
        PYTHONPATH: src:.
      run: |
        python demos/run_all_demos.py

    - name: Emit Commit Status
      if: success() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh api repos/${{ github.repository }}/statuses/${{ github.sha }} \
          -f state=success \
          -f context="ci/sclass-certification" \
          -f description="B.1.3 Security Certification & Full Suite 100% Passed" || true
