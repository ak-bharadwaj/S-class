name: S-Class Integration Adapters CI

on:
  push:
    branches: [ master, main, survival-v0 ]
  pull_request:
    branches: [ master, main, survival-v0 ]

permissions:
  contents: read

jobs:
  adapters:
    name: Protocol & Platform Adapters
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Adapter Tests
      env:
        PYTHONPATH: src:.
      run: |
        python -m pytest tests/adversarial/test_acp_spoof.py tests/adversarial/test_mcp_spoof.py tests/test_mcp_server.py -v
