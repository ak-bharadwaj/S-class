name: Sandbox Boundary Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Probe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Bubblewrap
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap procps iproute2

      - name: Run Sandbox Boundary Probe
        run: |
          chmod +x tools/probe_sandbox.sh
          ./tools/probe_sandbox.sh 2>&1 | tee probe_output_${{ matrix.os }}.txt

      - name: Upload Raw Probe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: probe-sandbox-${{ matrix.os }}
          path: probe_output_${{ matrix.os }}.txt
          if-no-files-found: error
