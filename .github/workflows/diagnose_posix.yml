name: OSS Parity Gate 1 - POSIX Layer C Diagnostics

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-posix-layer-c:
    name: POSIX Layer C Diagnostic Multi-Run (Ubuntu 24.04 / Python 3.12)
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout S-Class Plugin Repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 # v4.2.2
      with:
        fetch-depth: 0

    - name: Set up Python 3.12
      uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0 # v5.4.0
      with:
        python-version: "3.12"

    - name: Install Pinned Parity Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-parity-linux.txt

    - name: Run 5-Pass POSIX Layer C Diagnostics
      run: |
        python benchmark/parity/diagnose_posix_layer_c.py

    - name: Upload Diagnostic Artifacts
      uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb99ba841c # v4.6.1 # v4.6.1
      if: always()
      with:
        name: posix-layer-c-diagnostics-${{ github.sha }}
        path: benchmark/parity/posix_diagnostic_5_runs_results.json
        retention-days: 90
